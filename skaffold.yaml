apiVersion: skaffold/v2beta28
kind: Config
metadata:
  name: dapr-repro

build:
  artifacts:
    - image: &image dapr-repro
      docker:
        dockerfile: Dockerfile
  local:
    useBuildkit: true
    push: false

deploy:
  kubeContext: minikube
  helm:
    releases:
      - name: rabbitmq
        remoteChart: oci://registry-1.docker.io/bitnamicharts/rabbitmq
        namespace: &rabbit-namespace rabbit
        version: "16.0.14"
        createNamespace: true
        wait: true
        setValues:
          replicaCount: 1
          auth.username: rabbit
          auth.password: rabbit
          global.security.allowInsecureImages: true
          image.repository: bitnamilegacy/rabbitmq
          image.tag: "4.1.3"

      - name: dapr-repro
        chartPath: ./chart
        namespace: &app-namespace dapr-repro
        createNamespace: true
        upgradeOnChange: true
        artifactOverrides:
          image: *image
        imageStrategy:
          helm: {}
        setValues:
          image.pullPolicy: IfNotPresent
          rabbit.host: rabbitmq.rabbit.svc.cluster.local

portForward:
  - resourceType: service
    resourceName: rabbitmq
    namespace: *rabbit-namespace
    port: &rabbitmq-manager-port 15672
    localPort: *rabbitmq-manager-port
    address: 0.0.0.0
