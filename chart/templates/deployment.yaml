apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-repro
  labels:
    app: dapr-repro
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dapr-repro
  template:
    metadata:
      labels:
        app: dapr-repro
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dapr-repro"
        dapr.io/app-port: "8080"
        dapr.io/enable-app-health-check: "true"
        dapr.io/app-health-check-path: "/healthz"
        dapr.io/app-health-probe-interval: "3"
        dapr.io/app-health-probe-threshold: "2"
        dapr.io/block-shutdown-duration: "60s"
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: dapr-repro
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
